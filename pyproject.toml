[project]
name = "kbrag"
version = "0.1.0"
description = "Bedrock Knowledge Base RAG pipeline proof of concept"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.35.99",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
]

[project.scripts]
kbrag = "kbrag.cli:main"

[dependency-groups]
dev = [
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.3",
    "boto3-stubs[bedrock-agent-runtime,bedrock-runtime]==1.35.99",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbrag"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B904", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
pythonpath = ["src"]
